<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="300" fill="#06b6d4" opacity="0.15" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="350" fill="#3b82f6" opacity="0.12" filter="blur(90px)" />

  <!-- App Logo Container -->
  <g transform="translate(100, 100)">
    <rect width="100" height="100" rx="28" fill="url(#accent)" />
    <path d="M30 35 H70 V65 H30 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 27 L38 27 L22 43 Z" fill="#ffffff" />
    <path d="M78 73 L62 73 L78 57 Z" fill="#ffffff" />
  </g>

  <!-- Text Header (Arabic & English) -->
  <text x="230" y="150" font-family="system-ui, sans-serif" font-size="48" font-weight="900" fill="#f8fafc">مُحجِّم | Muhajim</text>
  <text x="230" y="185" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#38bdf8">100% In-Browser Smart Image Resizer &amp; Compressor by Novixa</text>

  <!-- Value Proposition Badge -->
  <rect x="100" y="260" width="340" height="46" rx="23" fill="#083344" stroke="#0e7490" stroke-width="2" />
  <text x="270" y="290" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#22d3ee" text-anchor="middle">✨ صفر بيانات تغادر جهازك (خصوصية 100%)</text>

  <!-- Main Title -->
  <text x="100" y="370" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff">تغيير مقاسات وضغط الصور بلمح البصر</text>
  <text x="100" y="425" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#94a3b8">أبعاد مثالية للمتاجر الإلكترونية (سلة، زد) وشبكات التواصل والهويات الرسمية</text>

  <!-- Formats Pills -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="130" height="48" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="65" y="30" font-family="monospace" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle">WEBP -90%</text>

    <rect x="150" y="0" width="120" height="48" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="210" y="30" font-family="monospace" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">JPG / JPEG</text>

    <rect x="290" y="0" width="100" height="48" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="340" y="30" font-family="monospace" font-size="18" font-weight="700" fill="#a78bfa" text-anchor="middle">PNG</text>

    <rect x="410" y="0" width="190" height="48" rx="14" fill="#064e3b" stroke="#059669" />
    <text x="505" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">⚡ معالجة جماعية ZIP</text>
  </g>

  <!-- Footer Powered by Novixa -->
  <text x="1100" y="580" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#64748b" text-anchor="end">Developed by Novixa Digital Engineering — novixa-cyan.vercel.app</text>
</svg>
